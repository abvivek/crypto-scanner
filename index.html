<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Order Block Scanner · Live crypto</title><meta name="theme-color" content="#0b0f17">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2322c55e'/%3E%3Cpath d='M8 20h5v-8H8zm11 4h5V8h-5z' fill='%23fff'/%3E%3C/svg%3E">
<style>:root{--bg:#0b0f17;--bg2:#111723;--card:#151c2a;--card2:#1a2233;--line:#243047;--txt:#e6ebf5;--mut:#8b97ad;--dim:#5d6a82;--bull:#22c55e;--bull-s:rgba(34,197,94,.14);--bear:#f43f5e;--bear-s:rgba(244,63,94,.14);--warn:#f59e0b;--warn-s:rgba(245,158,11,.15);--info:#38bdf8;--info-s:rgba(56,189,248,.14);--acc:#7c8cff;--acc-s:rgba(124,140,255,.15);--sh:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.18);--r:14px;color-scheme:dark}
[data-theme=light]{--bg:#f4f6fb;--bg2:#ffffff;--card:#ffffff;--card2:#f6f8fc;--line:#e3e8f2;--txt:#141a26;--mut:#5b667a;--dim:#8a94a7;--bull:#16a34a;--bull-s:rgba(22,163,74,.11);--bear:#e11d48;--bear-s:rgba(225,29,72,.1);--warn:#d97706;--warn-s:rgba(217,119,6,.12);--info:#0284c7;--info-s:rgba(2,132,199,.1);--acc:#4f5bd5;--acc-s:rgba(79,91,213,.1);--sh:0 1px 2px rgba(16,24,40,.05),0 6px 18px rgba(16,24,40,.06);color-scheme:light}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
.num{font-variant-numeric:tabular-nums}.up{color:var(--bull)}.dn{color:var(--bear)}.mut{color:var(--mut)}.dim{color:var(--dim)}
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{max-width:1500px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:16px;letter-spacing:-.01em;margin-right:6px}
.logo{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--bull),var(--acc));display:grid;place-items:center;color:#fff;font-size:13px;font-weight:800}
.tick{display:flex;gap:8px;align-items:baseline;padding:5px 10px;border:1px solid var(--line);border-radius:999px;background:var(--card);font-size:13px}
.tick b{font-weight:600}.spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--card2);color:var(--mut)}
.pill.bull{background:var(--bull-s);color:var(--bull)}.pill.bear{background:var(--bear-s);color:var(--bear)}.pill.warn{background:var(--warn-s);color:var(--warn)}.pill.info{background:var(--info-s);color:var(--info)}.pill.acc{background:var(--acc-s);color:var(--acc)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--dim);display:inline-block}.dot.ok{background:var(--bull);box-shadow:0 0 0 3px var(--bull-s)}.dot.bad{background:var(--bear)}.dot.wait{background:var(--warn)}
.status{display:flex;gap:10px;align-items:center;font-size:12px;color:var(--mut)}
.iconbtn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 10px;display:inline-flex;gap:6px;align-items:center;font-size:13px}
.iconbtn:hover{border-color:var(--acc)}.iconbtn.on{background:var(--acc-s);border-color:var(--acc);color:var(--acc)}
nav.tabs{max-width:1500px;margin:0 auto;display:flex;gap:4px;padding:0 16px;overflow-x:auto}
nav.tabs button{background:none;border:0;padding:9px 12px;color:var(--mut);font-weight:600;border-bottom:2px solid transparent;white-space:nowrap}
nav.tabs button.on{color:var(--txt);border-color:var(--acc)}
.badge{background:var(--acc);color:#fff;border-radius:999px;font-size:11px;padding:0 6px;margin-left:4px}
main{max-width:1500px;margin:0 auto;padding:16px}
.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:1.1fr 1.4fr}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:14px 16px;min-width:0}
.card h3{margin:0 0 10px;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);display:flex;align-items:center;gap:8px}
.card h3 .r{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:500}
.bias{display:flex;gap:18px;align-items:flex-end;flex-wrap:wrap}
.big{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1}
.lbl{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.split{height:10px;border-radius:999px;overflow:hidden;display:flex;background:var(--card2);margin:12px 0 8px}.split i{display:block;height:100%}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:10px}
.kv div{background:var(--card2);border-radius:10px;padding:8px 10px}.kv span{display:block;font-size:11px;color:var(--mut)}.kv b{font-size:15px}
.sec{display:grid;grid-template-columns:110px 1fr 1fr 72px;align-items:center;gap:6px;padding:5px 0;font-size:13px}
.sec .l,.sec .rt{height:14px;position:relative}.sec .l i{position:absolute;right:0;top:0;bottom:0;background:var(--bear);border-radius:4px 0 0 4px;opacity:.85}.sec .rt i{position:absolute;left:0;top:0;bottom:0;background:var(--bull);border-radius:0 4px 4px 0;opacity:.85}
.sec .rt{border-left:1px solid var(--line)}
table{width:100%;border-collapse:collapse;font-size:13px}th{font-size:11px;color:var(--mut);font-weight:600;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}tr.click{cursor:pointer}tr.click:hover td{background:var(--card2)}
td.r,th.r{text-align:right}.tw{overflow-x:auto}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:18px 0 12px}
.search{flex:1;min-width:180px;max-width:320px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px;outline:none}.search:focus{border-color:var(--acc)}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--mut)}.chip.on{background:var(--txt);color:var(--bg);border-color:var(--txt)}
select.sel{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 10px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.coin{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;cursor:pointer;transition:border-color .15s,transform .15s;position:relative;box-shadow:var(--sh)}
.coin:hover{border-color:var(--acc);transform:translateY(-1px)}.coin.bull{border-top:3px solid var(--bull)}.coin.bear{border-top:3px solid var(--bear)}.coin.flash{animation:fl 1.2s}
@keyframes fl{0%{box-shadow:0 0 0 3px var(--warn)}100%{box-shadow:var(--sh)}}
.coin .h{display:flex;align-items:center;gap:8px}.coin .sym{font-weight:800;font-size:15px}.coin .rank{margin-left:auto;font-size:11px;color:var(--mut)}
.star{background:none;border:0;padding:0;font-size:16px;color:var(--dim);line-height:1}.star.on{color:#fbbf24}
.coin .p{display:flex;align-items:baseline;gap:8px;margin:6px 0 4px}.coin .p b{font-size:19px;font-weight:700}
.meter{height:6px;background:var(--card2);border-radius:999px;overflow:hidden;margin:6px 0 8px}.meter i{display:block;height:100%;border-radius:999px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:3px 10px;font-size:12px}.facts span{color:var(--mut)}.facts b{font-weight:600;text-align:right}
.coin .f{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap;align-items:center}
.spark{display:block;width:100%;height:30px;margin-top:6px}
/* detail */
#detail{position:fixed;inset:0;z-index:50;background:rgba(3,6,12,.55);display:none;backdrop-filter:blur(3px)}
#detail.open{display:block}
.dpanel{position:absolute;inset:16px;background:var(--bg);border:1px solid var(--line);border-radius:18px;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.45)}
.dhead{position:sticky;top:0;z-index:3;background:var(--bg);display:flex;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.dbody{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:14px;padding:14px 16px}
.chartwrap{position:relative;height:520px;border:1px solid var(--line);border-radius:var(--r);background:var(--card);overflow:hidden}
#chart{position:absolute;inset:0}#ovl{position:absolute;inset:0;pointer-events:none;z-index:2}
.seg{display:inline-flex;background:var(--card2);border-radius:10px;padding:3px;gap:2px}.seg button{border:0;background:none;padding:5px 11px;border-radius:8px;font-weight:600;font-size:12px;color:var(--mut)}.seg button.on{background:var(--card);color:var(--txt);box-shadow:var(--sh)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:8px}.legend i{display:inline-block;width:12px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.state{border-radius:12px;padding:12px 14px;margin-bottom:12px;border:1px solid var(--line);background:var(--card)}
.state.bull{background:var(--bull-s);border-color:transparent}.state.bear{background:var(--bear-s);border-color:transparent}.state.warn{background:var(--warn-s);border-color:transparent}.state.info{background:var(--info-s);border-color:transparent}
.state b{font-size:16px;display:block;margin-bottom:4px}
.plan{display:grid;grid-template-columns:1fr auto;gap:5px 10px;font-size:13px}.plan span{color:var(--mut)}
.gauge{height:12px;border-radius:999px;background:var(--bear);overflow:hidden;margin:8px 0 4px}.gauge i{display:block;height:100%;background:var(--bull)}
.liq{max-height:640px;overflow:auto}
.liqrow{display:grid;grid-template-columns:62px 1fr 90px 100px;gap:8px;padding:7px 4px;border-bottom:1px solid var(--line);font-size:13px;align-items:center}
.liqrow.big{font-weight:700}
.note{font-size:12px;color:var(--mut)}
.callout{border-radius:12px;padding:12px 14px;background:var(--bear-s);color:var(--txt);border-left:4px solid var(--bear);margin-bottom:14px}
.callout.w{background:var(--warn-s);border-color:var(--warn)}
.empty{padding:28px;text-align:center;color:var(--mut)}
.toast{position:fixed;right:16px;bottom:16px;z-index:80;display:flex;flex-direction:column;gap:8px}
.toast div{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:12px;padding:10px 14px;box-shadow:var(--sh);max-width:340px;font-size:13px}
.loading{padding:60px 20px;text-align:center;color:var(--mut)}.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:sp 1s linear infinite;margin:0 auto 12px}@keyframes sp{to{transform:rotate(360deg)}}
@media (max-width:1100px){.dbody{grid-template-columns:1fr}.g3{grid-template-columns:1fr}}
@media (max-width:760px){.g2{grid-template-columns:1fr}.dpanel{inset:0;border-radius:0}.chartwrap{height:400px}.tick.eth,.status .txt{display:none}.big{font-size:24px}main{padding:12px}.sec{grid-template-columns:84px 1fr 1fr 60px}.bar{gap:8px}}

/* time machine + risk */
.tick.trend.on{border-color:color-mix(in srgb,var(--bull) 45%,var(--line))}.tick.trend.off{border-color:color-mix(in srgb,var(--bear) 45%,var(--line))}
.tmbtn{margin-left:auto;border:1px solid var(--line);background:var(--card2);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;color:var(--acc)}
.tmbtn:hover{border-color:var(--acc);background:var(--acc-s)}.tmbtn.sm{padding:1px 7px;margin-left:4px}
.btn{border:0;background:var(--acc);color:#fff;border-radius:10px;padding:9px 16px;font-weight:700;font-size:14px}.btn:hover{filter:brightness(1.08)}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--mut)}
.form input,.form select{border:1px solid var(--line);background:var(--card2);border-radius:10px;padding:8px 10px;font-size:14px;text-transform:none;letter-spacing:0;font-weight:500;color:var(--txt);outline:none;width:100%}
.form input:focus,.form select:focus{border-color:var(--acc)}
.form label.chk{flex-direction:row;align-items:center;gap:8px;text-transform:none;font-size:13px;font-weight:600;align-self:end;padding-bottom:9px}.form label.chk input{width:auto}
details.manual{margin-top:12px;border:1px dashed var(--line);border-radius:12px;padding:8px 12px}details.manual summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--mut)}details.manual .form{margin-top:10px}
.callout.g{background:var(--bull-s);border-color:var(--bull)}.warn-t{color:var(--warn)}
svg.chart{display:block;width:100%;height:auto;margin-top:6px}svg.chart .ax{font-size:11px;fill:var(--mut);font-family:inherit}
.verdict{display:flex;flex-direction:column;gap:2px;border-radius:12px;padding:10px 12px;margin-bottom:10px;font-size:13px}.verdict b{font-size:16px}
.verdict.bull{background:var(--bull-s)}.verdict.bull b{color:var(--bull)}.verdict.warn{background:var(--warn-s)}.verdict.warn b{color:var(--warn)}.verdict.bear{background:var(--bear-s)}.verdict.bear b{color:var(--bear)}
ul.reasons{margin:8px 0 0;padding-left:18px;font-size:12px;color:var(--bear)}
td .why{font-size:12px;white-space:normal;display:inline-block;max-width:280px;vertical-align:middle}
@media (max-width:760px){.form{grid-template-columns:1fr 1fr}.tick.trend .dim{display:none}}

/* coin report */
.crpick{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.crpick .search{max-width:260px}.crpick .chips{display:flex;gap:6px;flex-wrap:wrap}
.crtitle{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:12px}.crsym{font-size:22px;font-weight:800}.crpx b{font-size:22px;font-weight:800}
.crverdict{display:grid;grid-template-columns:1.6fr 1fr 1fr;gap:14px;align-items:center;margin-top:12px;border-radius:12px;padding:12px 14px;background:var(--card2)}
.crverdict.bull{background:var(--bull-s)}.crverdict.bear{background:var(--bear-s)}.crverdict b{display:block;font-size:20px;font-weight:800;margin-top:2px}
.biasbar{position:relative;height:6px;border-radius:999px;background:linear-gradient(90deg,var(--bear),var(--dim) 50%,var(--bull));margin-top:6px}.biasbar i{position:absolute;top:-4px;width:4px;height:14px;border-radius:2px;background:var(--txt);transform:translateX(-50%)}
.crg{grid-template-columns:1fr 1.15fr}.crchart{height:460px}.minichart{height:150px;position:relative;margin-top:4px}
.tip{border-bottom:1px dotted var(--dim);cursor:help}
ul.reasonsl{list-style:none;padding:0;margin:0;font-size:13px;display:grid;gap:4px}ul.reasonsl b{display:inline-block;min-width:34px}
.gauge.sm{height:8px;margin:0}
.setup{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--card2)}.setup.bull{border-left:4px solid var(--bull)}.setup.bear{border-left:4px solid var(--bear)}
@media (max-width:1100px){.crg{grid-template-columns:1fr}}
@media (max-width:760px){.crverdict{grid-template-columns:1fr}.crchart{height:360px}.crpick .search{max-width:none}}
/* ---- Paper trades (DEMO) ---- */
.pill.demo{background:var(--warn-s);color:var(--warn);font-weight:700;letter-spacing:.02em;white-space:nowrap}
.callout.demo-c{border-color:var(--warn);background:var(--warn-s)}
.tick.demotick{border-color:var(--warn)}
.tmbtn.demob,.btn.demo-btn{border-color:var(--warn);color:var(--warn)}
.btn.demo-btn{background:var(--warn-s)}
.btn.demo-btn .mut{font-weight:400}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--txt)}
.btn.danger{color:var(--bear);border-color:var(--bear)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.sbtns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.sbtns .btn{flex:1;min-height:44px}
.sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px}
.sheet{background:var(--card);border:1px solid var(--line);border-radius:18px;max-width:460px;width:100%;max-height:92vh;overflow:auto;padding:14px 16px 18px;box-shadow:var(--sh)}
.sheet .grab{display:none;width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 10px}
.shead{display:flex;align-items:center;gap:8px;margin-bottom:10px}.shead b{font-size:17px}.shead .iconbtn{margin-left:auto}
.form.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form.f2 input,.form.f2 select{font-size:16px;min-height:42px;width:100%}
.seg.full{display:flex;width:100%}.seg.full button{flex:1;min-height:40px}
body.sheet-open{overflow:hidden}
.warn-t{color:var(--warn)}
.dmtools{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:12px}
.chk{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mut)}.chk input{width:18px;height:18px}
.dmcard{border-left:3px solid var(--bull)}.dmcard.bear{border-left-color:var(--bear)}
.dmh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.dmh .r{margin-left:auto}.big2{font-size:18px}
.dmlive{display:flex;justify-content:space-between;align-items:flex-end;margin:10px 0 6px}.dmlive>div{display:flex;flex-direction:column}.dmlive .r{text-align:right;align-items:flex-end}
.num.xl{font-size:24px;font-weight:700}
.dmbar{position:relative;height:30px;margin:8px 0 4px;border-radius:8px;background:linear-gradient(90deg,var(--bear-s),var(--card2) 40%,var(--bull-s));display:flex;justify-content:space-between;align-items:flex-end;font-size:11px;padding:0 6px 2px}
.dmbar i{position:absolute;top:2px;width:3px;height:14px;background:var(--txt);border-radius:2px;transform:translateX(-50%)}
.dmkv{grid-template-columns:repeat(4,1fr)}
.dmchart{height:220px;margin-top:10px;position:relative}
.dmtm{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
@media (max-width:640px){
  .sheetbg{align-items:flex-end;padding:0}
  .sheet{border-radius:18px 18px 0 0;max-width:none;padding-bottom:calc(18px + env(safe-area-inset-bottom))}
  .sheet .grab{display:block}
  .dmkv{grid-template-columns:1fr 1fr}
  .dmchart{height:190px}
  .num.xl{font-size:21px}
  .dmtm .btn{width:100%}
}
.btn.danger,.btn.ghost.danger{background:transparent;color:var(--bear);border:1px solid var(--bear)}
.dmsec{margin:18px 2px 10px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}.dmsec .mut{text-transform:none;letter-spacing:0;font-weight:400}
.modepill{margin-left:6px;font-size:10px;letter-spacing:.04em}
.modepill.fut{background:var(--info-s);color:var(--info)}
.modepill.spotm{background:var(--warn-s);color:var(--warn)}
.reasons li.warnli{color:var(--warn)}
</style></head>
<body>
<header class="top"><div class="bar">
  <div class="brand"><div class="logo">OB</div><span>Order Block Scanner</span><span class="pill acc">LIVE</span><span class="pill modepill" id="modepill" title="Market mode. Change it in Risk → Settings" style="cursor:pointer">FUTURES</span></div>
  <div class="tick" id="tbtc">BTC</div><div class="tick eth" id="teth">ETH</div><div class="tick trend" id="btctrend"><span class="mut">BTC trend</span> <b>–</b></div><div class="tick demotick" id="demotick" style="display:none;cursor:pointer"></div>
  <div class="spacer"></div>
  <div class="status" id="st"></div><span class="mut num" style="font-size:12px" id="upd">Loading…</span><b class="num" id="clock" style="font-size:13px"></b>
  <button class="iconbtn" id="bnotify" title="Browser notifications for top-coin signals">🔕 Alerts</button>
  <button class="iconbtn" id="bsound" title="Play a sound on signals">♪ Sound</button>

/* ---------- Time Machine: history, detection, simulation ---------- */
const HC = new Map();
async function fetchHist(sym, tf, n) {
  const key = `${sym}|${tf}|${n}`, hit = HC.get(key); if (hit && Date.now() - hit.at < 120000) return hit.k;
  let out = [], end = null;
  while (out.length < n + 1) {
    const lim = Math.min(1000, n + 1 - out.length);
    const k = (await spot(`/api/v3/klines?symbol=${sym}&interval=${tf}&limit=${lim}${end ? `&endTime=${end}` : ""}`)).map(parseK);
    if (!k.length) break; out = k.concat(out); end = k[0][0] - 1; if (k.length < lim) break;
  }
  const ms = TFMS[tf], now = Date.now(); out = out.filter(k => k[0] + ms <= now).slice(-n);
  HC.set(key, { at: Date.now(), k: out }); return out;
}
function simTrade(c, i, dir, entry, stop, tgt, N, cost) {
  const risk = Math.abs(entry - stop), path = [0];
  const fin = (why, n, exitPx) => { const g = (exitPx - entry) * dir / risk, fees = (cost.fee + cost.slip) * (entry + exitPx) / risk; path.push(g); return { why, hold: n - i, exitPx, grossR: g, netR: g - fees, feeR: fees, path }; };
  for (let n = i + 1; n <= Math.min(i + N, c.length - 1); n++) {
    const [, o, h, l, cl] = c[n];
    if (dir > 0 ? l <= stop : h >= stop) return fin("stop", n, dir > 0 ? Math.min(stop, o) : Math.max(stop, o));
    if (dir > 0 ? h >= tgt : l <= tgt) return fin("target", n, tgt);
    path.push((cl - entry) * dir / risk);

}
function runReplay(c, cfg) {

  if (cfg.mode === "ob") {
    const a = OB.atr(c), vw = OB.sessionVwap(c), dop = OB.dayOpen(c), obs = OB.findOrderBlocks(c, a);
    const sigs = OB.entrySignals(c, a, vw, dop, obs).filter(s => s.side === cfg.side); found = sigs.length; let busy = -1;
    for (const s of sigs) {

      const tg = s.entry + dir * cfg.rr * s.risk, r = simTrade(c, s.m, dir, s.entry, s.stop, tg, cfg.N, cost);
      if (!r) { open++; continue; } busy = s.m + r.hold; trades.push({ ...r, t: s.t, entry: s.entry, stop: s.stop, tgt: tg, trend: trendAt(s.t) });
    }
  } else {

      const e = c[i][4], st = e * (1 - dir * cfg.stopPct / 100), tg = e * (1 + dir * cfg.tgtPct / 100); found++;
      const r = simTrade(c, i, dir, e, st, tg, cfg.N, cost); if (!r) { open++; break; }
      trades.push({ ...r, t: c[i][0], entry: e, stop: st, tgt: tg, trend: trendAt(c[i][0]) }); i += r.hold - 1;

}

    winNet: R.filter(x => x > 0).length / n * 100, mean, gross: tr.reduce((a, x) => a + x.grossR, 0) / n, sd, ci: 1.96 * sd / Math.sqrt(n), pf: neg ? pos / neg : null,

}

function fanSVG(tr, rr, N) {
  const W = 640, H = 260, L = 38, B = 22, T = 10, Rr = 10; if (!tr.length) return "";

  const X = i => L + i / Math.max(1, maxH) * (W - L - Rr), Y = v => T + (hi - Math.max(lo, Math.min(hi, v))) / (hi - lo) * (H - T - B);
  const col = { target: "var(--bull)", stop: "var(--bear)", time: "var(--mut)" };
  const show = tr.slice(-400);
  const lines = show.map(x => `<polyline points="${x.path.map((v, i) => `${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(" ")}" style="stroke:${col[x.why]};stroke-opacity:${show.length > 150 ? .18 : .35};fill:none;stroke-width:1.2"/>`).join("");
  const med = []; for (let i = 0; i <= maxH; i++) { const v = tr.map(x => x.path[Math.min(i, x.path.length - 1)]).sort((a, b) => a - b); med.push(`${X(i).toFixed(1)},${Y(pctl(v, 0.5)).toFixed(1)}`); }
  const gl = [[0, "0R"], [-1, "-1R stop"], [rr, `+${rr}R target`]].map(([v, t]) => `<line x1="${L}" x2="${W - Rr}" y1="${Y(v)}" y2="${Y(v)}" style="stroke:${v > 0 ? "var(--bull)" : v < 0 ? "var(--bear)" : "var(--dim)"};stroke-dasharray:4 4;stroke-width:1"/><text x="${L - 4}" y="${Y(v) + 4}" text-anchor="end" class="ax">${v > 0 ? "+" : ""}${v}R</text>`).join("");
  const xt = [0, 0.25, 0.5, 0.75, 1].map(f => Math.round(f * maxH)).map(i => `<text x="${X(i)}" y="${H - 6}" text-anchor="middle" class="ax">${i}</text>`).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">${gl}${lines}<polyline points="${med.join(" ")}" style="stroke:var(--acc);stroke-width:2.5;fill:none"/>${xt}</svg>`;
}
function histSVG(R) {

  const lo = Math.floor(Math.min(-1.5, ...R) * 4) / 4, hi = Math.ceil(Math.max(0.5, ...R) * 4) / 4, w = 0.25, nb = Math.max(1, Math.round((hi - lo) / w));

  const ticks = []; for (let v = Math.ceil(lo); v <= hi; v++) ticks.push(`<text x="${(L + (v - lo) / w * bw).toFixed(1)}" y="${H - 6}" text-anchor="middle" class="ax">${v > 0 ? "+" : ""}${v}R</text>`);

  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" })); a.download = `demo-trades-${istDay()}.csv`; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
const demoBtn = (sym, side, p, src, cls2) => `<button class="tmbtn demob ${cls2 || ""}" data-demo="${sym}" data-side="${side || "bull"}"${p ? ` data-entry="${p.entry}" data-stop="${p.stop}"` : ""} data-src="${esc(src || "")}" title="Paper-trade this (DEMO, no real money)">▶ Demo</button>`;

  return `<div class="card dmtm" style="margin-top:14px"><div><b>Want to watch it live?</b> <span class="mut">Start a paper trade of this ${f.side === "bull" ? "long" : "short"} on ${baseOf(f.sym)} now.</span> ${DEMO_TAG}</div><button class="btn demo-btn" data-tmdemo="1">▶ Demo entry</button></div>` + h; };

  el.insertAdjacentHTML("beforeend", `<button class="btn demo-btn" style="margin-top:8px;width:100%" data-demo="${c.sym}" data-side="${ev ? ev.want : c.bias || "bull"}"${p ? ` data-entry="${p.entry}" data-stop="${p.stop}"` : ""} data-src="coin detail ${S.tf}">▶ Demo entry <span class="mut">(no real money)</span></button>`);
};

detail.renderShell = function () { _dShell2(); const c = this.c; const tf = $("#tfseg"); if (tf) tf.insertAdjacentHTML("beforebegin", `<button class="iconbtn tmhead demob" data-demo="${c.sym}" data-side="${c.ev ? c.ev.want : c.bias || "bull"}"${c.ev && c.ev.plan ? ` data-entry="${c.ev.plan.entry}" data-stop="${c.ev.plan.stop}"` : ""} data-src="coin detail">▶ Demo</button>`); };

document.addEventListener("click", e => {
  const d = e.target.closest("[data-demo]");
  if (d) { e.stopPropagation(); e.preventDefault(); openDemo({ sym: d.dataset.demo, side: d.dataset.side, entry: d.dataset.entry, stop: d.dataset.stop, target: d.dataset.target, src: d.dataset.src || "signal", useSig: !!d.dataset.entry }); return; }
  if (e.target.closest("#demotick")) { setTab("demo"); window.scrollTo(0, 0); return; }
  if (e.target.closest("[data-demo-new]")) { e.preventDefault(); openDemo({ src: "manual" }); return; }
  const cr = e.target.closest("[data-crdemo]"); if (cr && CR.A) { e.stopPropagation(); e.preventDefault(); const s = CR.A.setups[+cr.dataset.crdemo]; if (s) openDemo({ sym: CR.sym, side: s.side, entry: s.p.entry, stop: s.p.stop, src: `coin report ${s.tf} setup`, useSig: true }); return; }
  const tmd = e.target.closest("[data-tmdemo]"); if (tmd && TM.res) { e.stopPropagation(); e.preventDefault(); const f = TM.res.f, c = S.coins.get(f.sym), pl = c && c.ev && c.ev.plan && c.ev.want === f.side ? c.ev.plan : null;
    openDemo({ sym: f.sym, side: f.side, entry: f.entry || (pl && pl.entry), stop: f.stop || (pl && pl.stop), tmode: f.mode === "ob" && (+f.rr === 2 || +f.rr === 4.6) ? String(+f.rr) : "2", src: `Time Machine ${f.tf}`, useSig: !!(f.entry || pl) }); return; }
  const cl = e.target.closest("[data-dmclose]"); if (cl) { e.preventDefault(); const t = DM.open.find(x => x.id === +cl.dataset.dmclose); if (t) dmClose(t, t.last || t.entry, "Closed by you", Date.now(), "manual"); return; }
  if (!dmSheet) { if (e.target.id === "dm-csv") dmCSV(); if (e.target.id === "dm-reset" && confirm("Reset the demo account? This deletes all open and closed demo trades in this browser.")) { DM.open = []; DM.closed = []; dmSave(); dmSync(); renderDemo(); } return; }
  const id = e.target.id;
  if (id === "dm-x" || id === "dm-cancel" || e.target.id === "dmsheet") { dmSheet = null; dmRenderSheet(); return; }
  if (id === "dm-go") { dmStart(); return; }
  if (id === "dm-load") { const v = resolveSym($("#dm-sym").value); if (v) dmSheetSym(v); else toast(`Not a Binance ${FUTM ? "USDT-M perpetual" : "USDT spot pair"}.`); return; }
  const en = e.target.closest("[data-dmentry]"); if (en) { dmSheet.useSig = en.dataset.dmentry === "sig"; dmRenderSheet(); }
}, true);
document.addEventListener("change", e => {
  const id = e.target.id;
  if (id === "dm-be") { DM.be = e.target.checked; dmSave(); }
  if (id === "dm-pin") { DM.pin = e.target.checked; dmSave(); }
  if (!dmSheet) return;
  if (id === "dm-side") { dmSheet.side = e.target.value; if (dmSheet.live && (dmSheet.stop - dmSheet.live) * (dmSheet.side === "bull" ? 1 : -1) >= 0) { dmSheet.stop = +(dmSheet.live * (dmSheet.side === "bull" ? 0.99 : 1.01)).toPrecision(6); dmSheet.sigEntry = null; dmSheet.useSig = false; } dmRenderSheet(); }
  if (id === "dm-tmode") { dmSheet.tmode = e.target.value; dmRenderSheet(); }
  if (id === "dm-stop") { dmSheet.stop = +e.target.value; dmRenderSheet(); }
  if (id === "dm-custom") { dmSheet.custom = +e.target.value; dmRenderSheet(); }
  if (id === "dm-lev") { dmSheet.lev = Math.max(1, Math.min(+RK.maxLev || 20, Math.round(+e.target.value) || 1)); dmRenderSheet(); }
  if (id === "dm-sym" && dmSheet.manual) { const v = resolveSym(e.target.value); if (v && S.info.has(v)) dmSheetSym(v); }
});
document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.id === "dm-sym") { e.preventDefault(); $("#dm-load") ? $("#dm-load").click() : null; } if (e.key === "Escape" && dmSheet) { dmSheet = null; dmRenderSheet(); } });
let dmHiddenAt = 0;

setInterval(() => { if (!document.hidden) dmTick(); }, 1000);
setInterval(() => { for (const t of DM.open) if (t.fut && Date.now() >= (t.nextF || 0)) dmFunding(t); }, 60000);
setInterval(() => { if (!document.hidden && DM.open.length) { dmSave(); if (!dmStream || !dmStream.ws || dmStream.ws.readyState !== 1 || Date.now() - dmStream.last > 15000) dmCatchUp("catchup"); } }, 30000);

boot();
